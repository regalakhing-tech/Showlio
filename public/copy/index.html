<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f3f6fc"><title>Copy your code — Showlio</title>
  <link rel="icon" href="/assets/images/favicon.png">
  <style>
    /* The "Copy code" button in Showlio's emails opens this page: email apps can't copy, browsers can. */
    :root { color-scheme: light; font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #18213d; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; background: #f3f6fc; }
    main { width: 100%; max-width: 420px; padding: 32px 28px 28px; box-sizing: border-box; text-align: center; background: #fff; border: 1px solid #e3e8f4; border-radius: 20px; box-shadow: 0 24px 48px -32px #1d2b5c55; }
    img { display: block; width: 140px; height: auto; margin: 0 auto 20px; }
    h1 { margin: 0; font-size: 22px; line-height: 1.3; }
    p { margin: 10px 0 0; font-size: 14px; line-height: 1.6; color: #53607f; }
    .code { margin: 22px 0 0; padding: 16px 12px; font: 700 34px/1 'SF Mono', Menlo, Consolas, 'Courier New', monospace; letter-spacing: 10px; color: #2346e8; background: #f2f5ff; border: 2px dashed #b9c6ff; border-radius: 14px; user-select: all; overflow-wrap: anywhere; }
    button { width: 100%; margin-top: 18px; padding: 15px 20px; font: 600 16px/1 inherit; color: #fff; border: 0; border-radius: 12px; cursor: pointer; background: linear-gradient(95deg, #10b3ff 0%, #2f5bff 48%, #7b2dff 100%); box-shadow: 0 14px 24px -14px #3a45ffb3; transition: transform .2s, filter .2s; }
    button:hover { filter: brightness(1.06); }
    button:active { transform: scale(.98); }
    button:focus-visible { outline: 3px solid #2f5bff55; outline-offset: 3px; }
    .status { min-height: 22px; font-weight: 600; color: #0b8a5f; }
    .status.is-error { color: #c62f45; }
    a { display: inline-block; margin-top: 18px; font-size: 14px; font-weight: 600; color: #2f5bff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/images/showlio-logo-sm.webp" alt="Showlio" width="651" height="217">
    <h1 id="title">Your Showlio code</h1>
    <p id="lede">Copy it, then paste it into Showlio.</p>
    <div class="code" id="code" hidden></div>
    <button type="button" id="copy" hidden>Copy code</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <a href="/auth/">Back to Showlio</a>
  </main>
  <script>
    (() => {
      const code = (new URLSearchParams(location.search).get('code') || '').replace(/\s/g, '');
      const status = document.getElementById('status');
      const show = (message, error = false) => { status.textContent = message; status.classList.toggle('is-error', error); };
      if (!/^\d{6,10}$/.test(code)) {
        document.getElementById('title').textContent = 'No code in this link';
        document.getElementById('lede').textContent = 'Open the email from Showlio again and use its button, or type the code shown in the email.';
        return;
      }
      const box = document.getElementById('code');
      const button = document.getElementById('copy');
      box.textContent = code;
      box.hidden = button.hidden = false;
      const copy = (quiet) => (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(
        () => { button.textContent = 'Copied ✓'; show('Copied! Paste it into Showlio.'); },
        () => { if (!quiet) show('Your browser blocked copying. Tap and hold the code to copy it.', true); },
      );
      button.addEventListener('click', () => copy(false));
      // Most browsers allow copying straight away; others need the tap on the button.
      copy(true);
    })();
  </script>
</body>
</html>
