<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="A personal portfolio preview created with Showlio, saved in this browser.">
  <meta name="theme-color" content="#f0f7fc">
  <title>Portfolio — Showlio</title>
  <link rel="icon" href="/assets/images/favicon.png">
  <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/portfolio-public.css">
  <script type="module" src="/assets/js/portfolio-view.js"></script>
</head>
<body class="pf-viewer">
  <header class="pf-community-header" data-pf-community hidden>
    <a class="pf-community-brand" href="/app/"><img src="/assets/images/showlio-logo-sm.webp" alt="Showlio" width="115" height="38"></a>
    <span>Creator portfolio</span>
    <a href="/portfolio/">Create your portfolio</a>
  </header>
  <div class="pf-notice" data-pf-notice hidden><span></span><a href="/portfolio/">Back to builder</a></div>
  <main class="pf-viewer-main" data-pf-view aria-live="polite"><div class="pf-unavailable"><p>Opening portfolio…</p></div></main>
  <dialog class="pf-dialog" data-pf-dialog aria-labelledby="pf-detail-title">
    <button class="pf-dialog-close" type="button" aria-label="Close project details" data-pf-close>×</button>
    <div data-pf-dialog-content></div>
  </dialog>
</body>
</html>
