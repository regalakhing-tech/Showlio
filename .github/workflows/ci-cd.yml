name: Showlio CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Set up PHP
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Install locked dependencies
        run: npm ci
      - name: Check syntax, compile CSS and test HTTP behavior
        run: npm run check

  deploy:
    name: Deploy production
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check deployment configuration
        id: configuration
        shell: bash
        run: |
          if [[ -n "$VERCEL_TOKEN" && -n "$VERCEL_ORG_ID" && -n "$VERCEL_PROJECT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment is not configured. Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID to Actions secrets; see docs/DEPLOYMENT.md."
            echo "CI passed. Production deployment skipped because Vercel secrets are missing. See docs/DEPLOYMENT.md." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check out source
        if: steps.configuration.outputs.ready == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        if: steps.configuration.outputs.ready == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Deploy the checked commit and wait for readiness
        if: steps.configuration.outputs.ready == 'true'
        id: deployment
        run: node scripts/deploy.mjs
      - name: Verify deployed PHP endpoint
        if: steps.configuration.outputs.ready == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
        run: node scripts/smoke.mjs "$DEPLOYMENT_URL"
